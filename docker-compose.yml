services:
  postgres:
    image: postgres:17.4
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT}:5432
    networks:
      - common
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  s3:
    image: rustfs/rustfs:1.0.0-alpha.64
    volumes:
      - s3:/data
    networks:
      - common
    ports:
      - ${S3_PORT}:9000

networks:
  common:
    driver: bridge

volumes:
  postgres:
  s3:
