services:
  api:
    profiles:
      - deploy
    networks:
      - common
    ports:
      - ${API_WEB_PORT}:8080
    env_file:
      - .env
    build:
      context: .
      dockerfile: Api.Dockerfile

  api-migrations:
    profiles:
      - deploy
    networks:
      - common
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DATABASE}
    build:
      context: .
      dockerfile: ApiMigrations.Dockerfile
    entrypoint: sh
    command: >
      -c "
          until psql -c 'select 1'; do
            echo 'PostgreSQL is unavailable - sleeping' &&
            sleep 1
          done && psql -f /app/migrations.sql -v ON_ERROR_STOP=1
          "

  office:
    profiles:
      - deploy
    networks:
      - common
    ports:
      - ${OFFICE_WEB_PORT}:80
    build:
      context: .
      dockerfile: Office.Dockerfile
      args:
        - API_WEB_PUBLIC_URL=${API_WEB_PUBLIC_URL}
        - LINKS_WEB_PUBLIC_URL=${LINKS_WEB_PUBLIC_URL}

  links:
    profiles:
      - deploy
    networks:
      - common
    ports:
      - ${LINKS_WEB_PORT}:80
    build:
      context: .
      dockerfile: Links.Dockerfile
      args:
        - API_WEB_PUBLIC_URL=${API_WEB_PUBLIC_URL}

  agent:
    profiles:
      - deploy
    networks:
      - common
    ports:
      - ${AGENT_WEB_PORT}:80
    build:
      context: .
      dockerfile: Agent.Dockerfile
      args:
        - API_WEB_PUBLIC_URL=${API_WEB_PUBLIC_URL}

  customer:
    profiles:
      - deploy
    networks:
      - common
    ports:
      - ${CUSTOMER_WEB_PORT}:80
    build:
      context: .
      dockerfile: Customer.Dockerfile
      args:
        - API_WEB_PUBLIC_URL=${API_WEB_PUBLIC_URL}

  postgres:
    image: postgres:17.4
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT}:5432
    networks:
      - common
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.64
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/app/logs
    networks:
      - common
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
    ports:
      - ${RUSTFS_PORT}:9000

  o2:
    image: public.ecr.aws/zinclabs/openobserve:v0.16.2-amd64
    volumes:
      - o2_data:/data
    networks:
      - common
    environment:
      - ZO_DATA_DIR=/data
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD}
    ports:
      - ${ZO_PORT}:5080

networks:
  common:
    driver: bridge

volumes:
  postgres_data:
  rustfs_data:
  rustfs_logs:
  o2_data:
