services:
  postgres:
    image: postgres:17.4
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT}:5432
    networks:
      - common
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.64
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/app/logs
    networks:
      - common

    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
    ports:
      - ${RUSTFS_PORT}:9000
  o2:
    image: public.ecr.aws/zinclabs/openobserve:v0.16.2-amd64
    volumes:
      - o2_data:/data
    networks:
      - common
    environment:
      - ZO_DATA_DIR=/data
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD}
    ports:
      - ${ZO_PORT}:5080

networks:
  common:
    driver: bridge

volumes:
  postgres_data:
  rustfs_data:
  rustfs_logs:
  o2_data:
