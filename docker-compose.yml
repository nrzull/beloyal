services:
  postgres:
    image: postgres:17.4
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT}:5432
    networks:
      - common
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  s3:
    image: rustfs/rustfs:1.0.0-alpha.64
    volumes:
      - s3_data:/data
      - s3_logs:/app/logs
    networks:
      - common

    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY}
    ports:
      - ${S3_PORT}:9000
  seq:
    image: datalust/seq:2025.2
    networks:
      - common
    environment:
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD}
      - ACCEPT_EULA=Y
    ports:
      - ${SEQ_INGEST_PORT}:5341
      - ${SEQ_UI_PORT}:80
    volumes:
      - seq_data:/data

networks:
  common:
    driver: bridge

volumes:
  postgres_data:
  s3_data:
  s3_logs:
  seq_data:
